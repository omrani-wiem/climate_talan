services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8765}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
